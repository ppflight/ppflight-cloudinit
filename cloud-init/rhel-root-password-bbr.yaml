#cloud-config
# Reference copy of the AlmaLinux/CentOS vendor-data generated by the builder.
disable_root: false
ssh_pwauth: true
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]
timezone: UTC
ntp:
  enabled: true
growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false
resize_rootfs: true
package_update: false
package_upgrade: false
package_reboot_if_required: false
bootcmd:
  - [systemctl, mask, dnf-automatic.timer, dnf-automatic.service, dnf-automatic-download.timer, dnf-automatic-download.service, dnf-automatic-install.timer, dnf-automatic-install.service, dnf-automatic-notifyonly.timer, dnf-automatic-notifyonly.service, yum-cron.service]
  - [sh, -c, "systemctl stop dnf-automatic.timer dnf-automatic.service dnf-automatic-download.timer dnf-automatic-download.service dnf-automatic-install.timer dnf-automatic-install.service dnf-automatic-notifyonly.timer dnf-automatic-notifyonly.service yum-cron.service 2>/dev/null || true"]
packages:
  - qemu-guest-agent
  - chrony
  - vim-enhanced
  - curl
  - net-tools
write_files:
  - path: /etc/dnf/automatic.conf
    owner: root:root
    permissions: '0644'
    content: |
      [commands]
      download_updates = no
      apply_updates = no
  - path: /etc/ssh/sshd_config.d/00-ppflight-cloud.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
  - path: /etc/modules-load.d/tcp-bbr.conf
    owner: root:root
    permissions: '0644'
    content: |
      tcp_bbr
  - path: /etc/sysctl.d/99-ppflight-cloud.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.core.default_qdisc=fq
      net.ipv4.tcp_congestion_control=bbr
      kernel.dmesg_restrict=1
runcmd:
  - [modprobe, tcp_bbr]
  - [sysctl, --system]
  - [systemctl, enable, --now, sshd]
  - [systemctl, restart, sshd]
  - [systemctl, enable, --now, chronyd]
  - [systemctl, enable, --now, qemu-guest-agent]
  - [systemctl, enable, serial-getty@ttyS0.service]
