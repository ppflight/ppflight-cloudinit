#cloud-config
# Reference copy of the Debian/Ubuntu vendor-data generated by the builder.
disable_root: false
ssh_pwauth: true
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]
timezone: UTC
ntp:
  enabled: true
growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false
resize_rootfs: true
package_update: false
package_upgrade: false
package_reboot_if_required: false
bootcmd:
  - [systemctl, mask, apt-daily.timer, apt-daily-upgrade.timer, apt-daily.service, apt-daily-upgrade.service, unattended-upgrades.service]
  - [sh, -c, "systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true"]
packages:
  - qemu-guest-agent
  - vim
  - curl
  - net-tools
write_files:
  - path: /etc/apt/apt.conf.d/99zz-ppflight-no-auto-upgrades
    owner: root:root
    permissions: '0644'
    content: |
      APT::Periodic::Enable "0";
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::Unattended-Upgrade "0";
  - path: /etc/ssh/sshd_config.d/00-ppflight-cloud.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
  - path: /etc/modules-load.d/tcp-bbr.conf
    owner: root:root
    permissions: '0644'
    content: |
      tcp_bbr
  - path: /etc/sysctl.d/99-ppflight-cloud.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.core.default_qdisc=fq
      net.ipv4.tcp_congestion_control=bbr
      kernel.dmesg_restrict=1
runcmd:
  - [modprobe, tcp_bbr]
  - [sysctl, --system]
  - [systemctl, enable, --now, ssh]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, qemu-guest-agent]
  - [systemctl, enable, serial-getty@ttyS0.service]
