name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck build-cloud-templates.sh
      - name: Reject committed private keys
        run: |
          if git grep -nE 'BEGIN (OPENSSH |RSA |EC )?PRIVATE KEY'; then
            echo 'Private-key material must not be committed.' >&2
            exit 1
          fi
